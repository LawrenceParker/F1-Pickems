<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Pick'em Achievements</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>F1 Pick'em</h1>
  <nav>
    <a href="index.html">Leaderboard</a>
    <a href="achievements.html" aria-current="page">Achievements</a>
  </nav>
  <p class="sub" id="sub">Loading…</p>
  <div class="bar" id="bar" hidden>
    <label for="season">Season</label>
    <select id="season"></select>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>

  <p class="status" id="status"></p>
</main>

<script src="shared.js"></script>
<script>
let defs = [];
let lastList = '';

// The "tier" column in achievements.csv sets the card colour: 1-4, or bronze / silver / gold / diamond.
const TIER_NAMES = ['Bronze', 'Silver', 'Gold', 'Diamond'];
const TIER_ALIASES = { bronze: 1, silver: 2, gold: 3, diamond: 4, platinum: 4 };
function tierOf(def) {
  const v = (def.tier || '').trim().toLowerCase();
  if (!v) return 0;
  const n = TIER_ALIASES[v] || Number(v);
  return n >= 1 ? Math.min(Math.round(n), 4) : 0;
}

function render(model) {
  const evals = evaluateAchievements(model, defs);

  // Key for the tier colours that are actually used
  const used = [...new Set(evals.map(ev => tierOf(ev.def)))].filter(Boolean).sort();
  const key = used.map(t => `<span class="key"><i style="background:var(--tier-${t})"></i>${TIER_NAMES[t - 1]}</span>`).join('') +
    (used.length && evals.some(ev => !tierOf(ev.def)) ? '<span class="key"><i style="background:var(--tier-single)"></i>No tier</span>' : '');
  const errors = evals.filter(ev => ev.error).map(ev => `<span class="flag">${esc(ev.def.name)}: ${esc(ev.error)}</span>`).join('');
  $('summary').innerHTML = key + errors;

  const html = evals.length
    ? model.totals.map(t => {
        let earnedCount = 0;
        const cards = evals.map((ev, i) => {
          const hit = ev.holders.find(h => h.player === t.player);
          const tier = tierOf(ev.def);
          let cls, meta;
          if (hit) {
            earnedCount++;
            cls = tier ? 'tier-' + tier : '';
            meta = (tier ? TIER_NAMES[tier - 1] : 'Earned') + (hit.at ? ' · ' + hit.at : '');
          } else {
            cls = 'locked';
            meta = 'Locked';
          }
          return `<article class="card ${cls}" style="--i:${i}">` +
            `<h3>${esc(ev.def.name)}</h3><p>${esc(ev.def.description || '')}</p>` +
            `<div class="meta">${esc(meta)}</div></article>`;
        }).join('');
        return `<section class="player-block"><h2>${esc(t.player)}<small>${earnedCount} of ${evals.length} achievements</small></h2>` +
          `<div class="cards">${cards}</div></section>`;
      }).join('')
    : `<p class="empty">No achievements yet. Add rows to ${FILES.achievements}.</p>`;

  // Only touch the cards when they changed, so progressive loading doesn't replay the entrance.
  if (html !== lastList) { $('list').innerHTML = html; lastList = html; }
  setTimeout(() => document.body.classList.add('seen'), 1000);
}

(async function init() {
  try {
    const data = await loadData(['achievements']);
    defs = data.achievements;
    initSeasonSelect(data.picks, season => {
      $('sub').textContent = season + ' season';
      lastList = '';
      runSeason(season, data, render, setStatus);
    });
  } catch (e) { showFatal(e); }
})();
</script>
</body>
</html>
