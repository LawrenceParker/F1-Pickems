<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Pick'em Achievements</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>F1 Pick'em</h1>
  <nav>
    <a href="index.html">Leaderboard</a>
    <a href="achievements.html" aria-current="page">Achievements</a>
  </nav>
  <p class="sub" id="sub">Loading…</p>
  <div class="bar" id="bar" hidden>
    <label for="season">Season</label>
    <select id="season"></select>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>

  <p class="status" id="status"></p>
</main>

<script src="shared.js"></script>
<script>
let defs = [];
let lastList = '';
const showLocked = new Set();   // players whose locked achievements are expanded

// The "tier" column in achievements.csv is the rarity. Listed here from lowest to highest.
// Colours are the --common / --rare / --legendary / --epic variables at the top of style.css.
const RARITIES = ['common', 'rare', 'legendary', 'epic'];
const rarityOf = def => { const v = (def.tier || '').trim().toLowerCase(); return RARITIES.includes(v) ? v : ''; };
const badTier = def => !!(def.tier || '').trim() && !rarityOf(def);
const label = r => r.charAt(0).toUpperCase() + r.slice(1);

function render(model) {
  const evals = evaluateAchievements(model, defs);

  // Key for the rarity colours that are actually used
  const used = RARITIES.filter(r => evals.some(ev => rarityOf(ev.def) === r));
  const key = used.map(r => `<span class="key"><i style="background:var(--${r})"></i>${label(r)}</span>`).join('') +
    (used.length && evals.some(ev => !rarityOf(ev.def)) ? '<span class="key"><i style="background:var(--no-rarity)"></i>No rarity</span>' : '');
  const errors = evals.filter(ev => ev.error || badTier(ev.def))
    .map(ev => `<span class="flag">${esc(ev.def.name)}: ${esc(ev.error || 'unknown tier "' + ev.def.tier + '"')}</span>`).join('');
  $('summary').innerHTML = key + errors;

  // Players alphabetical. Within a player: earned first, then by rarity (highest first), then CSV order.
  const players = [...model.players].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
  const rank = r => RARITIES.indexOf(r);   // no rarity = -1, so it sorts last

  const html = evals.length
    ? players.map(player => {
        const items = evals.map((ev, i) => ({ ev, i, rarity: rarityOf(ev.def), hit: ev.holders.find(h => h.player === player) }));
        items.sort((a, b) => (!!b.hit - !!a.hit) || (rank(b.rarity) - rank(a.rarity)) || (a.i - b.i));

        const earned = items.filter(x => x.hit).length;
        const locked = items.length - earned;
        const open = showLocked.has(player);
        const color = playerColor(model.players.indexOf(player));
        const pills = [...used].reverse().map(r => {
          const n = items.filter(x => x.hit && x.rarity === r).length;
          return `<span class="rpill" style="--c:var(--${r})" title="${label(r)}"><i></i>${n}<span class="sr"> ${r}</span></span>`;
        }).join('');

        const cards = items.map((x, idx) => {
          const meta = x.hit ? 'Earned' + (x.hit.at ? ' - ' + x.hit.at : '') : 'Locked';
          return `<article class="card ${x.hit ? x.rarity : 'locked'}" style="--i:${idx}">` +
            (x.rarity ? `<div class="rarity">${label(x.rarity)}</div>` : '') +
            `<h3>${esc(x.ev.def.name)}</h3><p>${esc(x.ev.def.description || '')}</p>` +
            `<div class="meta">${esc(meta)}</div></article>`;
        }).join('');

        return `<section class="player-block${open ? ' show-locked' : ''}" style="--p:${color}">` +
          `<header class="phead"><div class="avatar" aria-hidden="true">${esc([...player][0].toUpperCase())}</div>` +
          `<div class="pinfo"><h2>${esc(player)}</h2>` +
          `<div class="pmeta"><span><strong>${earned}</strong> of ${items.length} earned</span>${pills}</div>` +
          `<div class="meter" aria-hidden="true"><i style="width:${(earned / items.length * 100).toFixed(0)}%"></i></div></div>` +
          (locked ? `<button type="button" class="toggle" data-p="${esc(player)}" data-n="${locked}" aria-pressed="${open}">${open ? 'Hide locked' : 'Show locked (' + locked + ')'}</button>` : '') +
          `</header>` +
          (earned ? '' : '<p class="none">Nothing earned yet.</p>') +
          `<div class="cards">${cards}</div></section>`;
      }).join('')
    : `<p class="empty">No achievements yet. Add rows to ${FILES.achievements}.</p>`;

  // Only touch the cards when they changed, so progressive loading doesn't replay the entrance.
  if (html !== lastList) { $('list').innerHTML = html; lastList = html; }
  setTimeout(() => document.body.classList.add('seen'), 1000);
}

// Show / hide a player's locked achievements without re-rendering.
$('list').addEventListener('click', e => {
  const b = e.target.closest('button.toggle');
  if (!b) return;
  const p = b.dataset.p, on = !showLocked.has(p);
  on ? showLocked.add(p) : showLocked.delete(p);
  b.closest('.player-block').classList.toggle('show-locked', on);
  b.setAttribute('aria-pressed', on);
  b.textContent = on ? 'Hide locked' : 'Show locked (' + b.dataset.n + ')';
});

(async function init() {
  try {
    const data = await loadData(['achievements']);
    defs = data.achievements;
    initSeasonSelect(data.picks, season => {
      $('sub').textContent = season + ' season';
      lastList = '';
      runSeason(season, data, render, setStatus);
    });
  } catch (e) { showFatal(e); }
})();
</script>
</body>
</html>
