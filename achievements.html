<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Pick'em Achievements</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>F1 Pick'em</h1>
  <nav>
    <a href="index.html">Leaderboard</a>
    <a href="achievements.html" aria-current="page">Achievements</a>
  </nav>
  <p class="sub" id="sub">Loading…</p>
  <div class="bar" id="bar" hidden>
    <label for="season">Season</label>
    <select id="season"></select>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>

  <p class="status" id="status"></p>
</main>

<script src="shared.js"></script>
<script>
let defs = [];
let lastList = '';

// Tiers: rows whose names end in a numeral ("First Equals Last I", "... II") form one group, in CSV order.
// An optional "group" column in achievements.csv overrides this.
const groupOf = d => (d.group || d.name.replace(/\s+(?:[IVX]{1,6}|\d{1,2})$/, '')).trim();
const tierClass = (idx, size) => size < 2 ? '' : 'tier-' + Math.min(idx + 1, 4);

function render(model) {
  const evals = evaluateAchievements(model, defs);
  const groups = new Map();
  evals.forEach(ev => {
    const g = groupOf(ev.def);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(ev);
  });
  const list = [...groups.entries()].map(([name, tiers]) => ({ name, tiers }));

  // Key to the tier colours
  const maxTiers = Math.min(4, Math.max(1, ...list.map(g => g.tiers.length)));
  let key = '';
  if (maxTiers > 1) {
    for (let t = 1; t <= maxTiers; t++) key += `<span class="key"><i style="background:var(--tier-${t})"></i>Tier ${t}${t === 4 && list.some(g => g.tiers.length > 4) ? '+' : ''}</span>`;
    if (list.some(g => g.tiers.length === 1)) key += '<span class="key"><i style="background:var(--tier-single)"></i>No tiers</span>';
  }
  const errors = evals.filter(ev => ev.error).map(ev => `<span class="flag">${esc(ev.def.name)}: ${esc(ev.error)}</span>`).join('');
  $('summary').innerHTML = key + errors;

  const html = list.length
    ? model.totals.map(t => {
        const earned = [], todo = [];
        list.forEach(g => {
          let top = -1;
          g.tiers.forEach((ev, i) => { if (ev.holders.some(h => h.player === t.player)) top = i; });
          if (top < 0) todo.push(g.name);
          else earned.push({ g, top, ev: g.tiers[top], at: g.tiers[top].holders.find(h => h.player === t.player).at });
        });
        const cards = earned.map((e, i) => {
          const size = e.g.tiers.length;
          return `<article class="card ${tierClass(e.top, size)}" style="--i:${i}">` +
            `<h3>${esc(e.ev.def.name)}</h3><p>${esc(e.ev.def.description || '')}</p>` +
            `<div class="meta">${size > 1 ? `Tier ${e.top + 1} of ${size}` : 'Earned'}${e.at ? ` · ${esc(e.at)}` : ''}</div></article>`;
        }).join('');
        return `<section class="player-block"><h2>${esc(t.player)}<small>${earned.length} of ${list.length} achievements</small></h2>` +
          (cards ? `<div class="cards">${cards}</div>` : '<p class="todo">No achievements yet.</p>') +
          (todo.length ? `<p class="todo">To unlock: ${todo.map(esc).join(', ')}</p>` : '') +
          '</section>';
      }).join('')
    : `<p class="empty">No achievements yet. Add rows to ${FILES.achievements}.</p>`;

  // Only touch the cards when they changed, so progressive loading doesn't replay the entrance.
  if (html !== lastList) { $('list').innerHTML = html; lastList = html; }
  setTimeout(() => document.body.classList.add('seen'), 1000);
}

(async function init() {
  try {
    const data = await loadData(['achievements']);
    defs = data.achievements;
    initSeasonSelect(data.picks, season => {
      $('sub').textContent = season + ' season';
      lastList = '';
      runSeason(season, data, render, setStatus);
    });
  } catch (e) { showFatal(e); }
})();
</script>
</body>
</html>
