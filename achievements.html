<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Pick'em Achievements</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>F1 Pick'em</h1>
  <nav>
    <a href="index.html">Leaderboard</a>
    <a href="achievements.html" aria-current="page">Achievements</a>
  </nav>
  <p class="sub" id="sub">Loading…</p>
  <div class="bar" id="bar" hidden>
    <label for="season">Season</label>
    <select id="season"></select>
  </div>

  <div class="summary" id="summary"></div>
  <div id="list"></div>

  <p class="status" id="status"></p>
</main>

<script src="shared.js"></script>
<script>
let defs = [];
let lastList = '';

// The "tier" column in achievements.csv is the rarity. Listed here from lowest to highest.
// Colours are the --common / --rare / --legendary / --epic variables at the top of style.css.
const RARITIES = ['common', 'rare', 'legendary', 'epic'];
const rarityOf = def => { const v = (def.tier || '').trim().toLowerCase(); return RARITIES.includes(v) ? v : ''; };
const badTier = def => !!(def.tier || '').trim() && !rarityOf(def);
const label = r => r.charAt(0).toUpperCase() + r.slice(1);

function render(model) {
  const evals = evaluateAchievements(model, defs);

  // Key for the rarity colours that are actually used
  const used = RARITIES.filter(r => evals.some(ev => rarityOf(ev.def) === r));
  const key = used.map(r => `<span class="key"><i style="background:var(--${r})"></i>${label(r)}</span>`).join('') +
    (used.length && evals.some(ev => !rarityOf(ev.def)) ? '<span class="key"><i style="background:var(--no-rarity)"></i>No rarity</span>' : '');
  const errors = evals.filter(ev => ev.error || badTier(ev.def))
    .map(ev => `<span class="flag">${esc(ev.def.name)}: ${esc(ev.error || 'unknown tier "' + ev.def.tier + '"')}</span>`).join('');
  $('summary').innerHTML = key + errors;

  const html = evals.length
    ? model.totals.map(t => {
        let earnedCount = 0;
        const cards = evals.map((ev, i) => {
          const hit = ev.holders.find(h => h.player === t.player);
          const rarity = rarityOf(ev.def);
          let cls, meta;
          if (hit) {
            earnedCount++;
            cls = rarity;
            meta = 'Earned' + (hit.at ? ' - ' + hit.at : '');
          } else {
            cls = 'locked';
            meta = 'Locked';
          }
          return `<article class="card ${cls}" style="--i:${i}">` +
            (rarity ? `<div class="rarity">${label(rarity)}</div>` : '') +
            `<h3>${esc(ev.def.name)}</h3><p>${esc(ev.def.description || '')}</p>` +
            `<div class="meta">${esc(meta)}</div></article>`;
        }).join('');
        return `<section class="player-block"><h2>${esc(t.player)}<small>${earnedCount} of ${evals.length} achievements</small></h2>` +
          `<div class="cards">${cards}</div></section>`;
      }).join('')
    : `<p class="empty">No achievements yet. Add rows to ${FILES.achievements}.</p>`;

  // Only touch the cards when they changed, so progressive loading doesn't replay the entrance.
  if (html !== lastList) { $('list').innerHTML = html; lastList = html; }
  setTimeout(() => document.body.classList.add('seen'), 1000);
}

(async function init() {
  try {
    const data = await loadData(['achievements']);
    defs = data.achievements;
    initSeasonSelect(data.picks, season => {
      $('sub').textContent = season + ' season';
      lastList = '';
      runSeason(season, data, render, setStatus);
    });
  } catch (e) { showFatal(e); }
})();
</script>
</body>
</html>
