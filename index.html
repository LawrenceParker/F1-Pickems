<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Pick'em Leaderboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>F1 Pick'em</h1>
  <nav>
    <a href="index.html" aria-current="page">Leaderboard</a>
    <a href="achievements.html">Achievements</a>
  </nav>
  <p class="sub" id="sub">Loading…</p>
  <div class="bar" id="bar" hidden>
    <label for="season">Season</label>
    <select id="season"></select>
  </div>

  <h2>Overall</h2>
  <div class="wrap"><table id="overall"></table></div>

  <section id="orderBox" hidden>
    <h2 id="orderTitle">Pick order</h2>
    <p class="hint" id="orderHint"></p>
    <div class="wrap"><table id="order"></table></div>
  </section>

  <h2>Points per round</h2>
  <div class="bar">
    <label for="mode">Show</label>
    <select id="mode">
      <option value="cum">Running total</option>
      <option value="round">Points each round</option>
    </select>
  </div>
  <div class="wrap">
    <div class="chart" id="chart"></div>
    <div class="legend" id="legend"></div>
  </div>

  <h2>Round by round</h2>
  <div class="wrap"><table id="rounds"></table></div>

  <p class="status" id="status"></p>
</main>

<script src="shared.js"></script>
<script>
let lastModel = null;
const hidden = new Set();

function render(model) {
  lastModel = model;
  renderOverall(model);
  renderPickOrder(model);
  renderChart(model);
  renderRounds(model);
}

function renderOverall(model) {
  $('overall').innerHTML =
    '<thead><tr><th>Rank</th><th>Player</th><th class="num">Points</th></tr></thead><tbody>' +
    model.totals.map(t =>
      `<tr class="${t.rank === 1 && t.pts > 0 ? 'lead' : ''}"><td class="rank">${t.rank}</td><td>${esc(t.player)}</td><td class="num">${t.pts}</td></tr>`
    ).join('') + '</tbody>';
}

function renderPickOrder(model) {
  const po = pickOrder(model);
  $('orderBox').hidden = !po;
  if (!po) return;
  const name = po.slot.race || po.slot.label;
  $('orderTitle').textContent = `Pick order for round ${po.nextRound}`;
  $('orderHint').textContent = (PICK_ORDER_BASIS === 'overall' ? 'Lowest season total picks first.' : `Lowest points from ${name} picks first.`) +
    ' Whoever picked the winner picks last.';
  $('order').innerHTML =
    '<thead><tr><th>Pick</th><th>Player</th><th class="num">' + esc(PICK_ORDER_BASIS === 'overall' ? 'Season points' : 'Last round') + '</th><th></th></tr></thead><tbody>' +
    po.rows.map((r, i) =>
      `<tr><td class="rank">${i + 1}</td><td>${esc(r.player)}</td><td class="num">${PICK_ORDER_BASIS === 'overall' ? r.overall : r.roundPts}</td><td class="pending">${esc(r.note)}</td></tr>`
    ).join('') + '</tbody>';
}

function niceStep(max) {
  return [1, 2, 5, 10, 20, 25, 50, 100, 200].find(s => max / s <= 5) || 500;
}

function renderChart(model) {
  const slots = model.slots.filter(s => s.done);
  if (!slots.length) {
    $('chart').innerHTML = '<p class="empty">The chart appears once a round has results.</p>';
    $('legend').innerHTML = '';
    return;
  }
  const cum = $('mode').value === 'cum';
  const val = (p, s) => {
    const c = model.cells[p][s.key];
    if (!c || !c.settled) return null;
    return cum ? model.cum[p][s.key] : c.pts;
  };
  const shown = model.players.filter(p => !hidden.has(p));
  let max = 0;
  shown.forEach(p => slots.forEach(s => { const v = val(p, s); if (v !== null && v > max) max = v; }));
  const step = niceStep(max), top = Math.max(step, Math.ceil(max / step) * step);

  const W = 860, H = 320, L = 44, R = 16, T = 12, B = 40;
  const x = i => slots.length === 1 ? (L + W - R) / 2 : L + i * (W - R - L) / (slots.length - 1);
  const y = v => H - B - v / top * (H - B - T);

  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Points per round for each player">`;
  for (let v = 0; v <= top; v += step) {
    svg += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>` +
           `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  const every = Math.ceil(slots.length / 12);
  slots.forEach((s, i) => {
    if (i % every === 0) svg += `<text x="${x(i)}" y="${H - B + 20}" text-anchor="middle">${esc(s.label)}</text>`;
  });
  shown.forEach(p => {
    const color = playerColor(model.players.indexOf(p));
    let d = '', gap = true, dots = '';
    slots.forEach((s, i) => {
      const v = val(p, s);
      if (v === null) { gap = true; return; }
      d += (gap ? 'M' : 'L') + x(i).toFixed(1) + ' ' + y(v).toFixed(1) + ' ';
      gap = false;
      dots += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${color}"><title>${esc(p)}, ${esc(s.label)}: ${v}</title></circle>`;
    });
    svg += `<path class="line" d="${d}" stroke="${color}"/>${dots}`;
  });
  svg += '</svg>';
  $('chart').innerHTML = svg;

  $('legend').innerHTML = model.players.map((p, i) =>
    `<button type="button" data-p="${esc(p)}" aria-pressed="${!hidden.has(p)}"><i style="background:${playerColor(i)}"></i>${esc(p)}</button>`
  ).join('');
}

function cellHtml(c) {
  if (!c) return '<td class="pending">–</td>';
  const row = inner => `<td class="cell"><div class="cellrow">${inner}</div></td>`;
  const plain = `<span class="drv">${esc(c.driver)}</span>`;
  if (c.state === 'pending') return row(`${plain}<span class="pill">pending</span>`);
  if (c.state === 'noscoring') return row(`${plain}<span class="flag">no scoring rule</span>`);
  if (c.state === 'missing') return row(`${plain}<span class="pill pts-zero">0</span><span class="flag" title="Driver not found in these results">not in results</span>`);
  const drv = `<span class="drv"${c.color ? ` style="color:${esc(c.color)}"` : ''}>${esc(c.driver)}</span>`;
  const cls = c.maxPts && c.pts >= c.maxPts ? 'pts-max' : c.pts > 0 ? 'pts-pos' : 'pts-zero';
  let tags = '';
  if (c.position === 1) tags += '<span class="tag" title="Finished first">winner</span>';
  if (c.dnf) tags += '<span class="tag" title="Did not finish">DNF</span>';
  return row(`${drv}<span class="pill ${cls}">${c.pts}</span>${tags}`);
}

function renderRounds(model) {
  const head = model.slots.map(s =>
    `<th>${esc(s.label)}<small>${esc(s.race || (s.done ? '' : 'Not yet raced'))}</small></th>`).join('');
  $('rounds').innerHTML =
    `<thead><tr><th class="player">Player</th>${head}<th class="num">Total</th></tr></thead><tbody>` +
    model.totals.map(t =>
      `<tr><td class="player">${esc(t.player)}</td>${model.slots.map(s => cellHtml(model.cells[t.player][s.key])).join('')}<td class="num">${t.pts}</td></tr>`
    ).join('') + '</tbody>';
}

$('mode').onchange = () => lastModel && renderChart(lastModel);
$('legend').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]');
  if (!b) return;
  const p = b.dataset.p;
  hidden.has(p) ? hidden.delete(p) : hidden.add(p);
  renderChart(lastModel);
});

(async function init() {
  try {
    const data = await loadData();
    initSeasonSelect(data.picks, season => {
      $('sub').textContent = season + ' season';
      runSeason(season, data, render, setStatus);
    });
  } catch (e) { showFatal(e); }
})();
</script>
</body>
</html>
